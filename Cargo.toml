[workspace]
members = [
    "apps/tablecraft-cli",
    "crates/foundation/tablecraft-core",
    "crates/engines/tablecraft-ace",
    "crates/platform/tablecraft-io",
    "crates/backends/tablecraft-access",
    "crates/foundation/tablecraft-db",
    "crates/backends/tablecraft-sqlite",
    "crates/foundation/tablecraft-schema",
    "crates/foundation/tablecraft-model",
    "crates/query/tablecraft-query",
    "crates/query/tablecraft-expressions",
    "crates/query/tablecraft-sql",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/replicraft/TableCraft"

[workspace.dependencies]
# CLI arguments, table presentation and host diagnostics
csv = "1.4"
comfy-table = { version = "8.0.1", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt"] }

# Typed errors and library instrumentation
thiserror = "2"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

# Checked decimal calculations (domain wrappers retain Access bounds)
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }

# Calendar values and GUID interchange
jiff = { version = "0.2.38", default-features = false, features = ["std", "perf-inline"] }
uuid = { version = "1.28.0", default-features = false }

# Bounded exact numeric means; no serialization or random features
num-bigint = { version = "0.4.8", default-features = false }
num-rational = { version = "0.4.2", default-features = false, features = ["num-bigint"] }
num-traits = { version = "0.2.19", default-features = false }
num-integer = { version = "0.1.47", default-features = false }

# Optional localized query error catalogs; hosts choose language and resources
fluent-bundle = { version = "0.16.0", default-features = false }
fluent-syntax = { version = "0.12.0", default-features = false }
unic-langid = { version = "0.9.6", default-features = false }

# Native byte layouts and SIMD text classification
zerocopy = { version = "0.8.63", default-features = false, features = ["derive"] }
wide = { version = "1.7.1", default-features = false }
bytemuck = { version = "1.25.2", default-features = false }

# Native index metadata collection experiments (benchmark consumers)
arrayvec = { version = "0.7.8", default-features = false }
smallvec = { version = "1.16.3", default-features = false, features = ["const_generics"] }

# Derived General collation-element dictionaries (not native index storage)
fst = { version = "0.4.7", default-features = false }

# Native attachment compression, using the pure Rust backend
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

# Access deployment CAB containers (pure Rust, read-only consumer)
cab = { version = "0.6.0", default-features = false }

# Access template OPC containers and RFC URI/IRI validation (no network runtime)
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }
iri-string = { version = "0.7.14", default-features = false, features = ["alloc"] }

# Shared native encryption hashes and optional image-journal integrity
sha2 = { version = "0.11.1", default-features = false }

# Native Office encryption descriptors and password/page decoding
quick-xml = { version = "0.42.0", default-features = false }
base64 = { version = "0.23.1", default-features = false }
aes = { version = "0.9.3", default-features = false, features = ["zeroize"] }
cbc = { version = "0.2.1", default-features = false, features = ["block-padding", "zeroize"] }
sha1 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.9.1", default-features = false }
subtle = { version = "2.6.1", default-features = false }
rc4 = { version = "0.2.0", default-features = false, features = ["zeroize"] }
md-5 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
getrandom = { version = "0.4.3", default-features = false }

# CLI hidden credentials and staged filesystem outputs
rpassword = "7.5.4"
tempfile = "3.27.0"

# Explicit legacy character-code decoding (allocation-free consumer)
encoding_rs = { version = "0.8.42", default-features = false }

# Explicit Unicode casing with compiled data and streamed output
icu_casemap = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "2.3.0", default-features = false, features = ["alloc"] }
writeable = { version = "0.6.4", default-features = false }

# SQL syntax
sqlparser = { version = "0.63", default-features = false, features = ["std"] }

# Synchronous SQLite storage (bundled native library, bounded read operations)
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }
tokio-rusqlite = { version = "0.8.0", default-features = false }
tokio = { version = "1.53.3", default-features = false, features = ["sync"] }

# Optional scalar serialization
serde = { version = "1", features = ["derive"] }

# Property tests and typed serialization checks (development consumers only)
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"

# Shared values, schema, object metadata and database contracts
tablecraft-core = { path = "crates/foundation/tablecraft-core", default-features = false }
tablecraft-model = { path = "crates/foundation/tablecraft-model", default-features = false }
tablecraft-schema = { path = "crates/foundation/tablecraft-schema", default-features = false }
tablecraft-db = { path = "crates/foundation/tablecraft-db", default-features = false }

# Platform I/O, native storage and built-in backends
tablecraft-io = { path = "crates/platform/tablecraft-io", default-features = false }
tablecraft-ace = { path = "crates/engines/tablecraft-ace", default-features = false }
tablecraft-access = { path = "crates/backends/tablecraft-access", default-features = false }
tablecraft-sqlite = { path = "crates/backends/tablecraft-sqlite", default-features = false }

# SQL parsing, scalar semantics and retrieval execution
tablecraft-sql = { path = "crates/query/tablecraft-sql", default-features = false }
tablecraft-expressions = { path = "crates/query/tablecraft-expressions", default-features = false }
tablecraft-query = { path = "crates/query/tablecraft-query", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
