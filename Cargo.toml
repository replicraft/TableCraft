[workspace]
members = ["apps/tablecraft-cli", "crates/tablecraft-core", "crates/tablecraft-query"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/replicraft/TableCraft"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
