[package]
name = "tablecraft-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Native database and saved-query adapter for TableCraft"

[lints]
workspace = true

[features]
ace16-create = ["tablecraft-ace/ace16-create", "tablecraft-io/fresh-publication"]
offline-write-session = ["journal", "tablecraft-io/filesystem-journal"]
journal = ["tablecraft-ace/journal"]
ace16-write-preview = ["tablecraft-ace/ace16-write-preview"]

[dependencies]
tablecraft-formats.workspace = true
tablecraft-io.workspace = true
tracing.workspace = true
tablecraft-ace.workspace = true
tablecraft-core.workspace = true
tablecraft-db.workspace = true
thiserror.workspace = true
tablecraft-model.workspace = true
tablecraft-schema.workspace = true
tablecraft-query.workspace = true
tablecraft-expressions.workspace = true
tablecraft-sql.workspace = true

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
uuid.workspace = true
zip.workspace = true
flate2.workspace = true
base64.workspace = true
tablecraft-testkit.workspace = true
clap.workspace = true
proptest.workspace = true

[[bench]]
name = "query"
harness = false

[[bench]]
name = "general_like"
harness = false
