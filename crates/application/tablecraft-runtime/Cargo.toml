[package]
name = "tablecraft-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
ace16-create = ["tablecraft-access/ace16-create"]
offline-edit = [
    "tablecraft-access/offline-write-session",
]

[dependencies]
tablecraft-builders.workspace = true
tablecraft-display.workspace = true
bytes.workspace = true
zeroize = { workspace = true, features = ["alloc"] }
tablecraft-access.workspace = true
tablecraft-ace.workspace = true
tablecraft-core.workspace = true
tablecraft-model.workspace = true
tablecraft-io.workspace = true
tablecraft-query.workspace = true
tablecraft-sql.workspace = true
thiserror.workspace = true
tracing.workspace = true
tablecraft-db.workspace = true
tablecraft-schema.workspace = true
tablecraft-expressions = { workspace = true, features = ["fluent-catalog"] }
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true
tablecraft-testkit = { workspace = true, features = ["access-support", "ace16-create-support", "expression-support"] }
