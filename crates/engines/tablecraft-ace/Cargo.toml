[package]
name = "tablecraft-ace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Bounded read-only Jet/ACE native format inspection"

[lints]
workspace = true

[dependencies]
tablecraft-io = { path = "../../platform/tablecraft-io", default-features = false }
tablecraft-core = { path = "../../foundation/tablecraft-core", default-features = false }
