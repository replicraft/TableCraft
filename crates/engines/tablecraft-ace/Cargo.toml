[package]
name = "tablecraft-ace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Bounded Jet/ACE inspection and offline native edits"

[features]
default = []
journal = ["tablecraft-io/journal"]
ace16-write-preview = []

[lints]
workspace = true

[dependencies]
bytemuck.workspace = true
flate2.workspace = true
wide.workspace = true
zerocopy.workspace = true
tracing.workspace = true
tablecraft-io.workspace = true
tablecraft-core.workspace = true
tablecraft-model.workspace = true
tablecraft-schema.workspace = true
tablecraft-sql.workspace = true
tablecraft-expressions = { workspace = true, features = ["sql"] }
thiserror.workspace = true

uuid.workspace = true
jiff.workspace = true

[dev-dependencies]
clap.workspace = true
proptest.workspace = true

[[bench]]
name = "native"
harness = false

[[bench]]
name = "bitmaps"
harness = false

[[bench]]
name = "attachments"
harness = false

[[example]]
name = "preview_ace16_update"
required-features = ["ace16-write-preview"]

[[example]]
name = "preview_ace16_fixed"
required-features = ["ace16-write-preview"]

[[example]]
name = "preview_ace16_batch"
required-features = ["ace16-write-preview"]
