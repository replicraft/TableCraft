[package]
name = "tablecraft-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Bounded synchronous I/O primitives independent of database formats"

[lints]
workspace = true

[dependencies]
tracing.workspace = true
tablecraft-core.workspace = true
thiserror.workspace = true
sha2 = { workspace = true, optional = true }

[features]
default = []
journal = ["dep:sha2"]
fresh-publication = ["dep:rustix", "dep:getrandom"]
filesystem-journal = ["journal", "fresh-publication"]

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true, features = ["std", "fs", "process"] }
getrandom = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
