[package]
name = "tablecraft-expressions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded scalar expression semantics for TableCraft"
publish = false

[lints]
workspace = true

[dependencies]
tablecraft-core.workspace = true
tablecraft-sql = { workspace = true, optional = true }
thiserror.workspace = true
time = { workspace = true, optional = true, features = ["parsing", "macros"] }

uuid = { workspace = true, optional = true }

[features]
default = []
sql = ["dep:tablecraft-sql", "dep:time", "dep:uuid"]

[dev-dependencies]
proptest.workspace = true
