[package]
name = "tablecraft-expressions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Rust code is MIT; the optional reference message data is CC-BY-4.0.
license = "MIT AND CC-BY-4.0"
repository.workspace = true
description = "Bounded scalar expression semantics for TableCraft"
publish = false

[lints]
workspace = true

[dependencies]
tablecraft-core.workspace = true
tablecraft-sql = { workspace = true, optional = true }
thiserror.workspace = true
encoding_rs.workspace = true
icu_casemap.workspace = true
icu_collator = { workspace = true, optional = true }
icu_locale_core.workspace = true
writeable.workspace = true
jiff.workspace = true
rust_decimal.workspace = true

uuid.workspace = true
fluent-bundle = { workspace = true, optional = true }
fluent-syntax = { workspace = true, optional = true }
unic-langid = { workspace = true, optional = true }

[features]
default = []
sql = ["dep:tablecraft-sql"]
fluent-catalog = ["dep:fluent-bundle", "dep:fluent-syntax", "dep:unic-langid"]
icu-text = ["dep:icu_collator"]

[dev-dependencies]
clap.workspace = true
memchr.workspace = true
proptest.workspace = true

[[example]]
name = "empty_arithmetic"
required-features = ["sql"]
