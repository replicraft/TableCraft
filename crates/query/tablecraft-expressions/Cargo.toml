[package]
name = "tablecraft-expressions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded scalar expression semantics for TableCraft"
publish = false

[lints]
workspace = true

[dependencies]
tablecraft-core = { path = "../../foundation/tablecraft-core", default-features = false }
tablecraft-sql = { path = "../tablecraft-sql", default-features = false, optional = true }
thiserror = "2"
time = { version = "0.3.55", default-features = false, features = ["parsing", "macros"], optional = true }

uuid = { version = "1.28.0", default-features = false, optional = true }

[features]
default = []
sql = ["dep:tablecraft-sql", "dep:time", "dep:uuid"]

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
