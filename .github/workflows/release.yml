name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/desktop-packaging.yml'
      - '.gitattributes'
      - 'scripts/packaging/**'
      - 'scripts/tests/test_package_*.py'
      - 'scripts/tests/test_file_associations.py'
      - 'scripts/tests/test_desktop_notices.py'
      - 'scripts/tests/test_update_signatures.py'
      - 'crates/platform/tablecraft-update/**'
      - 'packaging/desktop/notice-policy.json'
      - 'packaging/update-key.pub'
      - 'packaging/ThirdPartyLicenses.txt'
      - 'LICENSE'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docs/development/RELEASING.md'
      - 'docs/releases/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Validate release contract
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/packaging/package_cli.py validate --tag "$RELEASE_TAG"
          else
            python scripts/packaging/package_cli.py validate
          fi
      - run: python -m unittest discover -s scripts/tests -p 'test_package_*.py'
      - run: python -m unittest discover -s scripts/tests -p 'test_file_associations.py'
      - run: python -m unittest discover -s scripts/tests -p 'test_desktop_notices.py'

  build:
    name: Build and smoke-test ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: tablecraft.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: tablecraft.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: tablecraft
          - os: macos-15
            target: aarch64-apple-darwin
            executable: tablecraft
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: tablecraft
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable: tablecraft
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install repository-pinned Rust and native target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cli-${{ matrix.target }}
      - name: Link the Windows CRT statically
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - name: Build the headless CLI
        run: cargo build --locked --release -p tablecraft-cli --target ${{ matrix.target }}
      - name: Test packaging on the native platform
        run: python -m unittest discover -s scripts/tests -p 'test_package_*.py'
      - name: Package and verify extracted version/help
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: target/${{ matrix.target }}/release/${{ matrix.executable }}
        run: |
          set -euo pipefail
          python scripts/packaging/package_cli.py package --version "$RELEASE_VERSION" --target "$RELEASE_TARGET" --binary "$RELEASE_BINARY" --output dist
          archive=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print)
          python scripts/packaging/package_cli.py verify-archive --version "$RELEASE_VERSION" --target "$RELEASE_TARGET" --archive "$archive" --smoke
      - uses: actions/upload-artifact@v7
        with:
          name: tablecraft-cli-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  assemble:
    name: Verify every platform and complete checksums
    needs: [version, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: tablecraft-cli-${{ needs.version.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Require the exact six-platform release set
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python scripts/packaging/package_cli.py finalize --version "$RELEASE_VERSION" --output dist
          python scripts/packaging/package_cli.py verify --version "$RELEASE_VERSION" --output dist
      - name: Independently verify archives and sidecar checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tablecraft-cli-release-${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  desktop:
    name: Build and verify desktop packages without publishing
    needs: version
    uses: ./.github/workflows/desktop-packaging.yml
    permissions:
      contents: read

  sign:
    name: Authenticate the complete CLI and desktop release
    needs: [version, assemble, desktop]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    environment: update-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: tablecraft-cli-release-${{ needs.version.outputs.version }}
          path: release-input/cli
      - uses: actions/download-artifact@v8
        with:
          name: desktop-packaging-dry-run
          path: desktop-dry-run
      - uses: actions/download-artifact@v8
        with:
          name: desktop-packaging-resources
          path: resources
      - name: Install the signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y minisign
      - name: Require both exact archive sets before opening signing secrets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/packaging/package_cli.py validate --tag "$RELEASE_TAG"
          python scripts/packaging/package_cli.py verify --version "$RELEASE_VERSION" --output release-input/cli
          python scripts/packaging/desktop_release.py verify --version "$RELEASE_VERSION" --output desktop-dry-run/dist --notices resources/DesktopThirdPartyLicenses.txt --icon resources/icons/application.icns
          (cd release-input/cli && sha256sum --check SHA256SUMS.txt)
          (cd desktop-dry-run/dist && sha256sum --check SHA256SUMS-desktop.txt)
          # The reusable build also contains disposable-key tests. Copy only the
          # verified archive directory; never copy its signature/test-key folder.
          cp -R desktop-dry-run/dist release-input/desktop
      - name: Sign archives with the maintained TableCraft release key
        env:
          TABLECRAFT_UPDATE_SIGNING_KEY: ${{ secrets.TABLECRAFT_UPDATE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/packaging/update_signatures.py sign --version "$RELEASE_VERSION" --product cli --assets release-input/cli --output release-input/signatures-cli
          python scripts/packaging/update_signatures.py sign --version "$RELEASE_VERSION" --product desktop --assets release-input/desktop --output release-input/signatures-desktop
      - name: Verify every signature independently without signing secrets
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/packaging/update_signatures.py verify --version "$RELEASE_VERSION" --product cli --assets release-input/cli --output release-input/signatures-cli
          python scripts/packaging/update_signatures.py verify --version "$RELEASE_VERSION" --product desktop --assets release-input/desktop --output release-input/signatures-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: tablecraft-signed-release-${{ needs.version.outputs.version }}
          path: release-input
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish the complete signed GitHub release
    needs: [version, sign]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: tablecraft-signed-release-${{ needs.version.outputs.version }}
          path: release-input
      - uses: actions/download-artifact@v8
        with:
          name: desktop-packaging-resources
          path: resources
      - name: Install the independent signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y minisign
      - name: Reverify both products and signatures before any publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/packaging/package_cli.py validate --tag "$RELEASE_TAG"
          python scripts/packaging/package_cli.py verify --version "$RELEASE_VERSION" --output release-input/cli
          python scripts/packaging/desktop_release.py verify --version "$RELEASE_VERSION" --output release-input/desktop --notices resources/DesktopThirdPartyLicenses.txt --icon resources/icons/application.icns
          (cd release-input/cli && sha256sum --check SHA256SUMS.txt)
          (cd release-input/desktop && sha256sum --check SHA256SUMS-desktop.txt)
          python scripts/packaging/update_signatures.py verify --version "$RELEASE_VERSION" --product cli --assets release-input/cli --output release-input/signatures-cli
          python scripts/packaging/update_signatures.py verify --version "$RELEASE_VERSION" --product desktop --assets release-input/desktop --output release-input/signatures-desktop
          mkdir dist
          # Both archive verifiers and both signature verifiers require exact
          # directory membership. Only these four checked sets become downloads.
          cp release-input/cli/* release-input/desktop/* release-input/signatures-cli/* release-input/signatures-desktop/* dist/
      - name: Publish only the verified signed asset set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/v${RELEASE_VERSION}.md"
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if ! jq -e '.isDraft == true' release.json >/dev/null; then
              echo '::error::Release is already published; use a new version tag.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "TableCraft $RELEASE_TAG" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > uploaded.txt
          find dist -maxdepth 1 -type f -printf '%f\n' | sort > expected.txt
          diff -u expected.txt uploaded.txt
          prerelease=false
          if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=true; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --notes-file "$notes"
