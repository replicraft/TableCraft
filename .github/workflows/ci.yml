name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    name: Headless (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check standalone core
        run: cargo check -p tablecraft-core --no-default-features --locked
      - name: Check standalone SQL parser
        run: cargo check -p tablecraft-sql --no-default-features --locked
      - name: Lint minimal headless workspace
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - name: Test minimal headless workspace
        run: cargo test --workspace --no-default-features --locked
      - name: Lint serde-enabled core
        run: cargo clippy -p tablecraft-core --all-targets --all-features --locked -- -D warnings
      - name: Test serde-enabled core
        run: cargo test -p tablecraft-core --all-features --locked
      - name: Build release executable
        run: cargo build --workspace --release --no-default-features --locked
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Launch executable
        run: cargo run --locked --no-default-features -p tablecraft-cli -- --version
