name: Desktop packaging dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-packaging.yml'
      - '.github/workflows/release.yml'
      - 'scripts/packaging/**'
      - 'scripts/tests/test_update_signatures.py'
      - 'scripts/tests/test_minisign_tool.py'
      - 'scripts/tests/test_package_*.py'
      - 'scripts/tests/test_installer_contract.py'
      - 'scripts/tests/test_linux_tools.py'
      - 'packaging/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/tablecraft-desktop/**'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resources:
    name: Generate locked notices and icons
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check native installer identity contracts
        run: python -m unittest discover -s scripts/tests -p 'test_installer_contract.py'
      - run: cargo fetch --locked
      - run: mkdir resources
      - run: python scripts/packaging/desktop_notices.py fetch
      - run: python scripts/packaging/desktop_notices.py generate --output resources/DesktopThirdPartyLicenses.txt
      - name: Export icons without opening a window
        env:
          TABLECRAFT_ICON_DIR: resources/icons
        run: cargo run --locked -p tablecraft-ui --example export_application_icons
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-packaging-resources
          path: resources
          if-no-files-found: error

  build:
    name: Package desktop ${{ matrix.target }}
    needs: resources
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, target: x86_64-pc-windows-msvc, binary: tablecraft-desktop.exe}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc, binary: tablecraft-desktop.exe}
          - {os: macos-15-intel, target: x86_64-apple-darwin, binary: tablecraft-desktop}
          - {os: macos-15, target: aarch64-apple-darwin, binary: tablecraft-desktop}
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, binary: tablecraft-desktop}
          - {os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, binary: tablecraft-desktop}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate the workspace release version
        id: version
        run: python scripts/packaging/package_cli.py validate
      - uses: actions/download-artifact@v8
        with:
          name: desktop-packaging-resources
          path: resources
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libssl-dev libfontconfig1 \
            libx11-6 libx11-xcb1 libxcursor1 libxi6 libxrandr2 libegl1 libgl1 \
            libxkbcommon-x11-0 \
            ca-certificates dpkg-dev rpm desktop-file-utils shared-mime-info appstream \
            patchelf file binutils libfuse2 squashfs-tools
      - name: Select native Rust host and target
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          rustup set default-host "$RELEASE_TARGET"
          rustup target add "$RELEASE_TARGET"
          rustc -vV | grep -Fx "host: $RELEASE_TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release-${{ matrix.target }}
      - name: Static Windows CRT
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - run: cargo build --locked --release -p tablecraft-desktop --target ${{ matrix.target }}
      - name: Package and smoke-test extracted help and version only
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          icon=()
          if [[ "$RELEASE_TARGET" == *apple* ]]; then icon=(--icon resources/icons/application.icns); fi
          python scripts/packaging/package_desktop.py package --version "$version" --target "$RELEASE_TARGET" --binary "$RELEASE_BINARY" --notices resources/DesktopThirdPartyLicenses.txt "${icon[@]}" --output dist
          archive=$(find dist -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \))
          python scripts/packaging/package_desktop.py verify --version "$version" --target "$RELEASE_TARGET" --archive "$archive" --notices resources/DesktopThirdPartyLicenses.txt "${icon[@]}" --smoke
      - name: Test Linux preparation and reviewed tool provisioning
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s scripts/tests -p 'test_package_linux.py'
          python -m unittest discover -s scripts/tests -p 'test_linux_tools.py'
      - name: Fetch verified native Linux tools and runtime notices
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/packaging/linux_tools.py fetch --target "$RELEASE_TARGET" --output .cache/linux-tools
      - name: Verify that the shipped runtime sources can relink a changed library
        if: runner.os == 'Linux'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/packaging/linux_tools.py verify-relink --target "$RELEASE_TARGET" --output .cache/linux-tools
      - name: Build and verify native DEB, RPM and AppImage packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: |
          set -euo pipefail
          python scripts/packaging/package_linux.py \
            --version "$RELEASE_VERSION" --target "$RELEASE_TARGET" \
            --binary "$RELEASE_BINARY" --notices resources/DesktopThirdPartyLicenses.txt \
            --icon resources/icons/application-256.png --output dist --formats deb rpm appimage \
            --linuxdeploy .cache/linux-tools/linuxdeploy \
            --appimagetool .cache/linux-tools/appimagetool \
            --appimage-runtime .cache/linux-tools/runtime \
            --appimage-runtime-notices .cache/linux-tools/RuntimeThirdPartyLicenses.txt \
            --appimage-runtime-source .cache/linux-tools/RuntimeSource.tar.gz
      - name: Verify headless DEB installation and removal on the disposable runner
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package=$(python -c 'import sys; sys.path.insert(0, "scripts/packaging"); import installer_contract; print(installer_contract.name(*sys.argv[1:]))' "$RELEASE_VERSION" "$RELEASE_TARGET" deb)
          evidence="$RUNNER_TEMP/tablecraft-linux-lifecycle-$RELEASE_TARGET-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$evidence"
          { sudo dpkg --install "dist/$package"; } > "$evidence/install.log" 2>&1
          /usr/bin/tablecraft-desktop --version > "$evidence/version.txt"
          /usr/bin/tablecraft-desktop --help > "$evidence/help.txt"
          desktop-file-validate /usr/share/applications/org.replicraft.tablecraft.desktop
          test -f /usr/share/mime/packages/org.replicraft.tablecraft.xml
          test -f /usr/lib/tablecraft/RELEASE.json
          { sudo dpkg --remove tablecraft-desktop; } > "$evidence/remove.log" 2>&1
          test ! -e /usr/bin/tablecraft-desktop
          test ! -L /usr/bin/tablecraft-desktop
          test ! -e /usr/share/applications/org.replicraft.tablecraft.desktop
          test ! -e /usr/share/mime/packages/org.replicraft.tablecraft.xml
      - name: Retain Linux installer and tool evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-evidence-${{ matrix.target }}
          path: |
            .cache/linux-tools/receipt.json
            .cache/linux-tools/relink-check.json
            ${{ runner.temp }}/tablecraft-linux-lifecycle-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}/**
          if-no-files-found: warn
          retention-days: 14
      - name: Install the supported native .NET SDK for WiX
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install the official WiX 6 command-line tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'tablecraft-wix'
          dotnet tool install --tool-path $toolDirectory wix --version 6.0.2 --allow-roll-forward
          if ($LASTEXITCODE -ne 0) { throw 'WiX tool installation failed' }
          $wix = Join-Path $toolDirectory 'wix.exe'
          & $wix --version
          if ($LASTEXITCODE -ne 0) { throw 'The native WiX tool could not start' }
          "TABLECRAFT_WIX=$wix" >> $env:GITHUB_ENV
      - name: Build and independently verify the native MSI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: target/${{ matrix.target }}/release/${{ matrix.binary }}
          TABLECRAFT_MSI_EVIDENCE_DIRECTORY: ${{ runner.temp }}/tablecraft-msi-inspection-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $arguments = @(
            'scripts/packaging/package_windows.py',
            '--version', $env:RELEASE_VERSION, '--target', $env:RELEASE_TARGET,
            '--binary', $env:RELEASE_BINARY,
            '--notices', 'resources/DesktopThirdPartyLicenses.txt',
            '--icon', 'resources/icons/application.ico',
            '--wix', $env:TABLECRAFT_WIX, '--output', 'dist'
          )
          & python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Native MSI packaging or verification failed' }
      - name: Verify headless MSI install, registration and uninstall on the disposable runner
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $name = python -c 'import sys; sys.path.insert(0, "scripts/packaging"); import installer_contract; print(installer_contract.name(*sys.argv[1:]))' $env:RELEASE_VERSION $env:RELEASE_TARGET msi
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the MSI artifact' }
          $installer = Join-Path 'dist' $name
          $evidence = Join-Path $env:RUNNER_TEMP "tablecraft-msi-lifecycle-$env:RELEASE_TARGET-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File packaging/windows/test_lifecycle.ps1 `
            -Installer $installer -Version $env:RELEASE_VERSION -Target $env:RELEASE_TARGET `
            -EvidenceDirectory $evidence
          if ($LASTEXITCODE -ne 0) { throw 'The native MSI lifecycle check failed; inspect its evidence artifact' }
      - name: Retain MSI lifecycle evidence even when checks fail
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-msi-lifecycle-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/tablecraft-msi-lifecycle-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}/**
            ${{ runner.temp }}/tablecraft-msi-inspection-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}/**
          if-no-files-found: warn
          retention-days: 14
      - name: Install macOS disk-image packaging tools
        if: runner.os == 'macOS'
        run: python -m pip install -r packaging/macos/requirements.txt
      - name: Build and headlessly verify the custom drag-to-Applications DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive=$(python -c 'import sys; sys.path.insert(0, "scripts/packaging"); import package_desktop; print(package_desktop.archive_name(*sys.argv[1:]))' "$RELEASE_VERSION" "$RELEASE_TARGET")
          python scripts/packaging/package_macos.py package --version "$RELEASE_VERSION" --target "$RELEASE_TARGET" --archive "dist/$archive" --notices resources/DesktopThirdPartyLicenses.txt --icon resources/icons/application.icns --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  assemble:
    name: Assemble and test disposable-key signatures (never publish)
    needs: [resources, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: desktop-packaging-resources
          path: resources
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-package-*
          path: dist
          merge-multiple: true
      - name: Provision reviewed Minisign without signing secrets
        run: python scripts/packaging/minisign_tool.py --output "$RUNNER_TEMP/tablecraft-minisign"
      - run: minisign -v
      - run: python -m unittest discover -s scripts/tests -p 'test_update_signatures.py'
      - name: Verify complete archives and sign with an ephemeral test key
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python scripts/packaging/desktop_release.py finalize --version "$version" --output dist --notices resources/DesktopThirdPartyLicenses.txt --icon resources/icons/application.icns
          python scripts/packaging/desktop_release.py verify --version "$version" --output dist --notices resources/DesktopThirdPartyLicenses.txt --icon resources/icons/application.icns
          (cd dist && sha256sum --check SHA256SUMS-desktop.txt)
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          minisign -G -W -p "$keydir/TEST-ONLY.pub" -s "$keydir/TEST-ONLY.key" > /dev/null
          export UPDATE_SIGNING_KEY
          UPDATE_SIGNING_KEY=$(cat "$keydir/TEST-ONLY.key")
          python scripts/packaging/update_signatures.py sign --dry-run --version "$version" --product desktop --assets dist --output signatures --public-key "$keydir/TEST-ONLY.pub"
          unset UPDATE_SIGNING_KEY
          python scripts/packaging/update_signatures.py verify --dry-run --version "$version" --product desktop --assets dist --output signatures --public-key "$keydir/TEST-ONLY.pub"
          cp "$keydir/TEST-ONLY.pub" signatures/
          printf 'DRY RUN ONLY: signed with a disposable test key, not a distributable release.\n' > signatures/DRY-RUN.txt
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-packaging-dry-run
          path: |
            dist/*
            signatures/*
          if-no-files-found: error
          compression-level: 0
