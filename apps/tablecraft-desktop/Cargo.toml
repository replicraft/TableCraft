[package]
name = "tablecraft-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tablecraft-desktop"
path = "src/main.rs"

# Only the reviewed Windows regional-locale boundary permits scoped FFI.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[dependencies]
tablecraft-builders.workspace = true
tablecraft-update.workspace = true
semver.workspace = true
parking_lot.workspace = true
tablecraft-display.workspace = true
rfd = { workspace = true, features = ["xdg-portal", "wayland"] }
eframe = { workspace = true, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
egui.workspace = true
tablecraft-ui.workspace = true
fontique = { workspace = true, features = ["system", "fontconfig-dlopen"] }
clap.workspace = true
zeroize = { workspace = true, features = ["alloc"] }
tablecraft-runtime = { workspace = true, features = ["offline-edit", "ace16-create"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tablecraft-testkit = { workspace = true, features = ["access-support", "ace16-create-support"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true, features = ["std", "NSLocale", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Globalization", "Win32_System_SystemServices"] }
