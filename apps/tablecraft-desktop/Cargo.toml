[package]
name = "tablecraft-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tablecraft-desktop"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tablecraft-builders.workspace = true
tablecraft-display.workspace = true
rfd = { workspace = true, features = ["xdg-portal", "wayland"] }
eframe = { workspace = true, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
egui.workspace = true
tablecraft-ui.workspace = true
fontique = { workspace = true, features = ["system", "fontconfig-dlopen"] }
clap.workspace = true
zeroize = { workspace = true, features = ["alloc"] }
tablecraft-runtime = { workspace = true, features = ["offline-edit"] }
sys-locale.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tablecraft-testkit.workspace = true
tempfile.workspace = true
