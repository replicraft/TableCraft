[package]
name = "tablecraft-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tablecraft"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tablecraft-formats.workspace = true
tempfile.workspace = true
rpassword.workspace = true
zeroize = { workspace = true, features = ["alloc"] }
csv.workspace = true
rust_decimal.workspace = true
comfy-table.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
clap.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
tablecraft-sql.workspace = true
tablecraft-core.workspace = true
tablecraft-io = { workspace = true, features = ["fresh-publication"] }
tablecraft-expressions = { workspace = true, features = ["sql", "fluent-catalog", "icu-text"] }
tablecraft-query.workspace = true
tablecraft-ace = { workspace = true, features = ["ace16-write-preview"] }
tablecraft-model.workspace = true
tablecraft-access = { workspace = true, features = ["ace16-write-preview"] }
tablecraft-sqlite.workspace = true
uuid.workspace = true

[dev-dependencies]
tablecraft-testkit.workspace = true
flate2.workspace = true
rc4.workspace = true
aes.workspace = true
cbc.workspace = true
sha2.workspace = true
base64.workspace = true
rusqlite.workspace = true
